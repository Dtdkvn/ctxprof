<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Ctxprof context profile dashboard</title>
  <desc id="desc">A dark local dashboard with a context-window treemap, exact totals, costs, waste warnings, component details, and a prompt version comparison.</desc>
  <defs>
    <radialGradient id="bg" cx="80%" cy="0%" r="90%">
      <stop offset="0" stop-color="#241740"/>
      <stop offset=".44" stop-color="#0a0d13"/>
      <stop offset="1" stop-color="#07090d"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#131a24"/>
      <stop offset="1" stop-color="#0e131b"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <style>
      .text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#eef2f7}.muted{fill:#8491a3}.tiny{font-size:11px;letter-spacing:.08em}.small{font-size:13px}.body{font-size:15px}.strong{font-weight:700}.metric{font-size:27px;font-weight:750;letter-spacing:-.04em}.title{font-size:29px;font-weight:760;letter-spacing:-.045em}.line{stroke:#273140;stroke-width:1}.panel{fill:url(#panel);stroke:#273140;stroke-width:1}.cap{font-size:10px;letter-spacing:.13em;text-transform:uppercase}.tile-title{font-size:13px;font-weight:700}.tile-value{font-size:11px;fill-opacity:.72}
    </style>
  </defs>
  <rect width="1440" height="900" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1438" height="898" rx="17" fill="none" stroke="#2b3442"/>

  <g>
    <rect x="0" y="0" width="278" height="900" rx="18" fill="#0b0f15" fill-opacity=".94"/>
    <path d="M278 0V900" class="line"/>
    <rect x="24" y="25" width="38" height="38" rx="11" fill="url(#logo)"/>
    <path d="M35 52V41m7 11V34m7 18V44m7 8V31" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <text x="74" y="42" class="text strong" font-size="18">ctxprof</text>
    <text x="74" y="57" class="text muted tiny" font-size="8">CONTEXT PROFILER</text>
    <rect x="20" y="85" width="238" height="40" rx="10" fill="#111720" stroke="#273140"/>
    <path d="M36 101a6 6 0 1 0 0 12 6 6 0 0 0 0-12m5 11 5 5" fill="none" stroke="#667386" stroke-width="1.6" stroke-linecap="round"/>
    <text x="54" y="110" class="text muted small">Filter captures…</text>
    <text x="28" y="156" class="text muted cap">RECENT CAPTURES</text>

    <rect x="17" y="169" width="244" height="66" rx="12" fill="#24163c" stroke="#6942a8"/>
    <text x="31" y="193" class="text strong small">Support agent · verbose</text>
    <text x="31" y="216" class="text muted tiny">gpt-5.6-terra  ·  1,184 tok</text>
    <text x="220" y="193" class="text muted tiny">12:00</text>

    <rect x="17" y="241" width="244" height="66" rx="12" fill="#10151d"/>
    <text x="31" y="265" class="text strong small">Support agent · lean</text>
    <text x="31" y="288" class="text muted tiny">gpt-5.6-terra  ·  326 tok</text>
    <text x="220" y="265" class="text muted tiny">12:04</text>

    <rect x="17" y="710" width="244" height="118" rx="13" fill="#10151d" stroke="#273140"/>
    <circle cx="34" cy="733" r="4" fill="#2dd4bf"/>
    <text x="46" y="737" class="text strong small" fill="#2dd4bf">Local-first</text>
    <text x="31" y="762" class="text muted tiny">Headers are never stored.</text>
    <text x="31" y="780" class="text muted tiny">Saved bodies are secret-redacted</text>
    <text x="31" y="798" class="text muted tiny">and size-capped by default.</text>
  </g>

  <g transform="translate(309 28)">
    <text x="0" y="14" class="text cap" fill="#a78bfa">CONTEXT CAPTURE</text>
    <text x="0" y="49" class="text title">Support agent · verbose</text>
    <text x="0" y="72" class="text muted small">gpt-5.6-terra  ·  /v1/chat/completions  ·  support-v1</text>
    <rect x="884" y="7" width="132" height="30" rx="15" fill="#10151d" stroke="#273140"/>
    <circle cx="901" cy="22" r="4" fill="#2dd4bf"/>
    <text x="912" y="26" class="text muted tiny">Proxy connected</text>
    <rect x="1025" y="7" width="116" height="30" rx="15" fill="#10151d" stroke="#273140"/>
    <text x="1041" y="26" class="text muted tiny">Estimated split</text>

    <g transform="translate(0 101)" filter="url(#shadow)">
      <rect width="272" height="103" rx="14" class="panel"/>
      <text x="17" y="27" class="text muted cap">INPUT CONTEXT</text>
      <text x="17" y="62" class="text metric">1,184 tok</text>
      <text x="17" y="83" class="text muted tiny">Provider-reported total</text>
    </g>
    <g transform="translate(284 101)" filter="url(#shadow)">
      <rect width="272" height="103" rx="14" class="panel"/>
      <text x="17" y="27" class="text muted cap">ESTIMATED COST</text>
      <text x="17" y="62" class="text metric">$0.00343</text>
      <text x="17" y="83" class="text muted tiny">Standard text rates · 2026-08-11</text>
    </g>
    <g transform="translate(568 101)" filter="url(#shadow)">
      <rect width="272" height="103" rx="14" class="panel"/>
      <text x="17" y="27" class="text muted cap">POTENTIAL WASTE</text>
      <text x="17" y="62" class="text metric">113 tok</text>
      <text x="17" y="83" class="text muted tiny">Heuristic, validate before removal</text>
    </g>
    <g transform="translate(852 101)" filter="url(#shadow)">
      <rect width="289" height="103" rx="14" class="panel"/>
      <text x="17" y="27" class="text muted cap">ACTIONABLE WARNINGS</text>
      <text x="17" y="62" class="text metric">1</text>
      <text x="17" y="83" class="text muted tiny">Review before shipping</text>
    </g>

    <g transform="translate(0 218)" filter="url(#shadow)">
      <rect width="766" height="386" rx="15" class="panel"/>
      <text x="17" y="28" class="text strong body">Context treemap</text>
      <text x="17" y="46" class="text muted tiny">Area = allocated input tokens</text>
      <circle cx="515" cy="27" r="4" fill="#7c3aed"/><text x="524" y="31" class="text muted tiny">System</text>
      <circle cx="581" cy="27" r="4" fill="#0f9f8f"/><text x="590" y="31" class="text muted tiny">Tools</text>
      <circle cx="636" cy="27" r="4" fill="#2563a8"/><text x="645" y="31" class="text muted tiny">Messages</text>
      <circle cx="708" cy="27" r="4" fill="#c7770a"/><text x="717" y="31" class="text muted tiny">Results</text>
      <g transform="translate(13 60)">
        <rect width="740" height="313" rx="9" fill="#070a0e"/>
        <rect x="3" y="3" width="440" height="307" rx="7" fill="#c7770a"/>
        <text x="18" y="27" class="text tile-title">Tool result · search_orders</text>
        <text x="18" y="48" class="text tile-value">726 allocated tokens</text>
        <text x="408" y="294" class="text tile-value">61%</text>
        <rect x="447" y="3" width="290" height="136" rx="7" fill="#7c3aed"/>
        <text x="462" y="27" class="text tile-title">System · #1</text>
        <text x="462" y="48" class="text tile-value">170 allocated tokens</text>
        <text x="704" y="123" class="text tile-value">14%</text>
        <rect x="447" y="143" width="187" height="167" rx="7" fill="#0f9f8f"/>
        <text x="462" y="168" class="text tile-title">Tool · search_orders</text>
        <text x="462" y="189" class="text tile-value">145 tokens</text>
        <text x="604" y="294" class="text tile-value">12%</text>
        <rect x="638" y="143" width="99" height="82" rx="7" fill="#0b756a"/>
        <text x="650" y="168" class="text tile-title">issue_refund</text>
        <text x="650" y="189" class="text tile-value">113 tok</text>
        <rect x="638" y="229" width="99" height="81" rx="7" fill="#2563a8"/>
        <text x="650" y="254" class="text tile-title">User · #2</text>
        <text x="650" y="275" class="text tile-value">30 tok</text>
      </g>
    </g>

    <g transform="translate(780 218)" filter="url(#shadow)">
      <rect width="361" height="386" rx="15" class="panel"/>
      <text x="17" y="28" class="text strong body">Waste signals</text>
      <text x="17" y="46" class="text muted tiny">Explainable heuristics, never silent deletion</text>
      <rect x="315" y="16" width="28" height="23" rx="11" fill="#151c26" stroke="#273140"/>
      <text x="326" y="31" class="text muted tiny">2</text>
      <g transform="translate(14 67)">
        <rect width="333" height="103" rx="11" fill="#15191f"/>
        <rect x="10" y="12" width="29" height="29" rx="8" fill="#3b2910"/>
        <text x="21" y="32" class="text strong small" fill="#f59e0b">↗</text>
        <text x="51" y="28" class="text strong small">Tool result dominates the context</text>
        <text x="51" y="49" class="text muted tiny">61% of input is one tool result.</text>
        <text x="51" y="67" class="text muted tiny">Summarize, paginate, or select fields</text>
        <text x="51" y="85" class="text muted tiny">before reinserting it.</text>
      </g>
      <g transform="translate(14 178)">
        <rect width="333" height="103" rx="11" fill="#15191f"/>
        <rect x="10" y="12" width="29" height="29" rx="8" fill="#16273b"/>
        <text x="21" y="32" class="text strong small" fill="#60a5fa">i</text>
        <text x="51" y="28" class="text strong small">Tool “issue_refund” was not used</text>
        <text x="51" y="49" class="text muted tiny">This exchange did not call the tool.</text>
        <text x="51" y="67" class="text muted tiny">Consider loading tools on demand after</text>
        <text x="51" y="85" class="text muted tiny">validating representative traffic.</text>
      </g>
      <rect x="14" y="298" width="333" height="70" rx="11" fill="#10151d" stroke="#273140"/>
      <text x="29" y="324" class="text muted cap">PRIVACY</text>
      <text x="29" y="348" class="text small" fill="#2dd4bf">Headers excluded · secrets redacted</text>
    </g>

    <g transform="translate(0 618)" filter="url(#shadow)">
      <rect width="1141" height="150" rx="15" class="panel"/>
      <text x="17" y="29" class="text strong body">Prompt-version diff</text>
      <text x="17" y="48" class="text muted tiny">support-v1  →  support-v2 · averages across captures</text>
      <g transform="translate(17 68)">
        <rect width="344" height="64" rx="11" fill="#111720" stroke="#273140"/>
        <text x="14" y="22" class="text muted cap">INPUT TOKENS</text>
        <text x="14" y="49" class="text strong" font-size="21" fill="#2dd4bf">−858</text>
        <text x="281" y="49" class="text muted small">−72.5%</text>
      </g>
      <g transform="translate(377 68)">
        <rect width="344" height="64" rx="11" fill="#111720" stroke="#273140"/>
        <text x="14" y="22" class="text muted cap">TOTAL TOKENS</text>
        <text x="14" y="49" class="text strong" font-size="21" fill="#2dd4bf">−863</text>
      </g>
      <g transform="translate(737 68)">
        <rect width="387" height="64" rx="11" fill="#111720" stroke="#273140"/>
        <text x="14" y="22" class="text muted cap">ESTIMATED COST</text>
        <text x="14" y="49" class="text strong" font-size="21" fill="#2dd4bf">−$0.00222</text>
        <text x="320" y="49" class="text muted small">−64.8%</text>
      </g>
    </g>

    <text x="0" y="797" class="text muted tiny">Deterministic local demo · no API key or external service</text>
    <text x="946" y="797" class="text muted tiny">ctxprof v0.1</text>
  </g>
</svg>
