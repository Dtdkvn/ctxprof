name: Ctxprof context budget
description: Fail a workflow when LLM context tokens, cost, warnings, or components regress.
author: Ctxprof contributors
branding:
  icon: pie-chart
  color: purple
inputs:
  config:
    description: Path to ctxprof.config.json in the calling repository.
    required: false
    default: ctxprof.config.json
  pricing:
    description: Optional exact provider/model pricing catalog.
    required: false
    default: ""
runs:
  using: node24
  main: action-dist/action.js
