name: Ctxprof context budget
description: Fail a workflow when LLM context tokens, cost, warnings, or components regress.
author: Ctxprof contributors
branding:
  icon: pie-chart
  color: purple
inputs:
  config:
    description: Relative path to ctxprof.config.json inside the calling repository workspace.
    required: false
    default: ctxprof.config.json
  pricing:
    description: Optional relative path to an exact pricing catalog inside the repository workspace.
    required: false
    default: ""
runs:
  using: node24
  main: action-dist/action.js
