name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run smoke
      - run: npm run smoke:action
      - run: npm run smoke:package
      - run: npm audit --audit-level=high
      - run: npm pack --dry-run

  action:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise the clean-tree Node 24 Action
        uses: ./
        with:
          config: ctxprof.config.json

  docker:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ctxprof:test
      - name: Run the hardened image
        run: |
          set -euo pipefail
          container="$(docker run --detach --name ctxprof-ci --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:8787:8787 \
            ctxprof:test serve --host 0.0.0.0 --port 8787 --allow-remote --data /data)"
          trap 'docker rm --force --volumes "$container" >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect --format '{{.Config.User}}' "$container")" = "node"
          docker exec "$container" sh -c \
            '! command -v npm && ! command -v npx && ! command -v corepack && ! command -v yarn && ! command -v yarnpkg'
          test "$(docker exec "$container" sh -c \
            'find /app/dist -type f \( -name "*.map" -o -name "*.d.ts" \) | wc -l')" = "0"
          node scripts/check-image-layers.mjs ctxprof:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/healthz >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs "$container"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/ | grep -q "Ctxprof"
